[project]
name = "gestiones-sos-hex"
version = "0.1.0"
description = "Gestión"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.12.1",
    "passlib>=1.7.4",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
